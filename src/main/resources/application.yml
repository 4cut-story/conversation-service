spring:
  application:
    name: conversation-service
  threads:
    virtual:
      enabled: true
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/fourcut?currentSchema=conversation}
    username: ${DB_USERNAME:fourcut}
    password: ${DB_PASSWORD:fourcut}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: ${DB_SCHEMA:conversation}
  flyway:
    default-schema: ${DB_SCHEMA:conversation}
    schemas: ${DB_SCHEMA:conversation}
    # 서비스마다 이력 테이블을 따로 둔다 (개발 DB는 여러 서비스가 스키마 하나를 함께 쓴다)
    table: flyway_history_conversation
    # 이미 테이블이 있는 스키마(Crowfoot v17 반영본)에서는 V1을 건너뛰고 이력만 만든다
    baseline-on-migrate: true
    baseline-version: 1

storage:
  endpoint: ${MINIO_ENDPOINT:http://localhost:9000}
  region: ${MINIO_REGION:us-east-1}
  access-key: ${MINIO_ACCESS_KEY:minioadmin}
  secret-key: ${MINIO_SECRET_KEY:minioadmin}
  bucket: ${MINIO_BUCKET:4cut}

server:
  port: ${PORT:8082}
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true

conversation:
  # 한 사람이 하루(한국 시각)에 만들 수 있는 만화 수. 0이면 제한하지 않는다
  daily-limit: ${CONVERSATION_DAILY_LIMIT:10}
  # 제한하지 않을 사용자 공개 ID (쉼표로 구분. 테스트 회차·스토리 게시 계정)
  daily-limit-exempt: ${CONVERSATION_DAILY_LIMIT_EXEMPT:}

pipeline:
  lease-time: 90s
  worker-seen-within: 60s
  # 장면 추출의 서버 단계(전사 교정 3분 + 구간 동시 호출 3분)가 다 들어가게 둔다
  local-step-timeout: 8m
  # 같은 입력의 외부 LLM 답을 다시 쓴다(llm-cache/). 같은 녹음이면 같은 장면·콘티가 나와 시험 세트로 짝 비교한다
  llm-cache: ${PIPELINE_LLM_CACHE:true}

scenario:
  llm-model: ${LLM_MODEL:qwen3:8b}

# LLM 작업(장면 추출·콘티·전사 교정)은 Claude → Gemini → GPU 워커(qwen) 순서로 처리한다.
# 키가 없는 API는 건너뛰고, 실패·한도 초과·키 만료면 cooldown 동안 쉬며 다음 순서가 한다
claude:
  api-key: ${ANTHROPIC_API_KEY:}
  model: ${CLAUDE_MODEL:claude-opus-5-5}
  effort: ${CLAUDE_EFFORT:medium}
  max-tokens: 16000
  timeout: 120s
  cooldown: 10m
  # 비용을 줄이려고 서버가 바로 부르는 작업은 작업마다 모델을 나눈다. 콘티(대기열 작업)는 위 model을 쓴다
  tasks:
    correct:
      model: ${CLAUDE_CORRECT_MODEL:claude-haiku-5-5}
      effort: ${CLAUDE_CORRECT_EFFORT:low}
    extract:
      model: ${CLAUDE_EXTRACT_MODEL:claude-sonnet-5-5}
      effort: ${CLAUDE_EXTRACT_EFFORT:medium}
    placement:
      model: ${CLAUDE_PLACEMENT_MODEL:claude-sonnet-5-5}
      effort: ${CLAUDE_PLACEMENT_EFFORT:low}

gemini:
  api-key: ${GEMINI_API_KEY:}
  model: ${GEMINI_MODEL:gemini-3.5-flash-lite}
  timeout: 60s
  cooldown: 10m

comic:
  image-size: ${COMIC_IMAGE_SIZE:768}
  content-url: ${SERVICES_CONTENT_URL:http://localhost:8083}
  # 캐릭터 참조 강도 스케줄 (model-runtime이 그림 작업의 ipSchedule로 받는다)
  ip-early-scale: ${COMIC_IP_EARLY_SCALE:0.2}
  ip-early-steps: ${COMIC_IP_EARLY_STEPS:2}
  ip-late-boost: ${COMIC_IP_LATE_BOOST:0.0}
  panel-seed-step: ${COMIC_PANEL_SEED_STEP:0}

# 캐릭터 DB (REQ-018). 콘티 인물을 이름이나 설명 임베딩(pgvector, BGE-M3 1024차원)으로 찾아 IP-Adapter 참조로 그린다
characters:
  enabled: ${CHARACTERS_ENABLED:true}
  max-distance: ${CHARACTERS_MAX_DISTANCE:0.30}
  embedding-url: ${CHARACTERS_EMBEDDING_URL:https://emb.java21.net}
  embedding-model: ${CHARACTERS_EMBEDDING_MODEL:bge-m3}
  ip-adapter: ${CHARACTERS_IP_ADAPTER:plus-sdxl-vit-h}
